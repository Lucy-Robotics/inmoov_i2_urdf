  - i02_rightHand_ringFingerMid_joint
  - i02_rightHand_ringFingerTip_joint
  - i02_rightHand_ThumbTip_joint
cameras:
  - id: ext_camera
    name: External USB Webcam
    topic: /ext_camera/jpg
    compressed_topic: /ext_camera/jpg/compressed
    message_type: sensor_msgs/msg/CompressedImage
    external: true
    sim_gz_topic: /world/default/camera
  - id: realsense-rgb
    name: Realsense RGB
    topic: /realsense/realsense2_camera/color/image_raw
    compressed_topic: /realsense/realsense2_camera/color/image_raw/compressed
    message_type: sensor_msgs/msg/CompressedImage
    external: false
    link: i02_head_left_eye_vertical
  - id: realsense-aligned-depth
    name: Realsense Aligned Depth
    topic: /realsense/realsense2_camera/aligned_depth_to_color/image_raw
    compressed_topic: /realsense/realsense2_camera/aligned_depth_to_color/image_raw/compressed
    message_type: sensor_msgs/msg/CompressedImage
    external: false
    link: i02_head_left_eye_vertical
  - id: left_eye_camera
    name: Left eye webcam
    topic: /camera/internal/left_eye/jpg
    compressed_topic: /camera/internal/left_eye/jpg/compressed
    message_type: sensor_msgs/msg/CompressedImage
    external: false
    link: i02_head_right_eye_vertical
  - id: right_eye_camera
    name: Right eye webcam
    topic: /camera/internal/right_eye/jpg
    compressed_topic: /camera/internal/right_eye/jpg/compressed
    message_type: sensor_msgs/msg/CompressedImage
    external: false
    link: i02_head_left_eye_vertical
firmware:
  source_dir: lucy_embedded_firmware
  build_dir: build/firmware
controller_manager:
  update_rate: 100
boards:
  mega_left:
    serial_id: ''
    board_class: i2c_pwm_only
    slave_address: 1
    pca_addresses:
      - 65
    internal_servo_slots: 16
    firmware_target: arduino_mega
    compile_definition: mega_left
    topic_actuators: actuators/left
    topic_sensors: sensors/left
    controller:
      name: left_controller
      type: joint_trajectory_controller/JointTrajectoryController
  mega_right:
    serial_id: 1453230323235110C0D0
    board_class: i2c_pwm_only
    slave_address: 1
    pca_addresses:
      - 65
      - 64
    internal_servo_slots: 32
    firmware_target: arduino_mega
    compile_definition: mega_right
    topic_actuators: actuators/right
    topic_sensors: sensors/right
    controller:
      name: right_controller
      type: joint_trajectory_controller/JointTrajectoryController
